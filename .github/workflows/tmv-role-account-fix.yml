name: Apply TMV Role and Account Fix

on:
  push:
    branches: [ master ]
    paths:
      - 'updates/fix-role-persistence-tech-manager-accounts.py'
      - '.github/workflows/tmv-role-account-fix.yml'

permissions:
  contents: write

jobs:
  apply-role-account-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out patch script
        run: |
          git show origin/master:updates/fix-role-persistence-tech-manager-accounts.py > /tmp/fix-role-persistence-tech-manager-accounts.py

      - name: Apply patch
        run: python3 /tmp/fix-role-persistence-tech-manager-accounts.py

      - name: Verify patch
        run: |
          grep -n "cfgTech\|role: 'technician'\|/api/technicians" api-server.js
          grep -n "merged.superusers\|merged.managers\|merged.technicians" api-server.js
          grep -n "mgrEmail\|techUser\|techPass\|Save Technician\|saveTechnicians" db-viewer.html
          grep -n "var patch = {}; patch\[key\] = value" db-viewer.html
          node --check api-server.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "api-server.js db-viewer.html "

      - name: Commit and push production branch
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add api-server.js db-viewer.html
          git commit -m "Fix role persistence and add technician account fields"
          git push origin HEAD:ms02-live-sync-20260908-085804
