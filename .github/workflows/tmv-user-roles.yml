name: Apply TMV User Roles

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmv-user-roles.yml
      - updates/apply-user-roles.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-user-roles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804
          path: prod

      - name: Check out patch script
        uses: actions/checkout@v4
        with:
          ref: master
          path: control

      - name: Apply User Roles patch
        run: python3 control/updates/apply-user-roles.py prod

      - name: Verify User Roles patch
        working-directory: prod
        run: |
          node --check api-server.js
          grep -n "/api/user-roles\|extraSu\|delete pub.superusers" api-server.js
          grep -n "userRolesBlock\|loadUserRoles\|changeUserRole" db-viewer.html
          git diff --check

      - name: Commit and push production branch
        working-directory: prod
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md api-server.js db-viewer.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Superuser User Roles management"
            git push origin HEAD:ms02-live-sync-20260908-085804
          fi
