name: Apply TMV PWA Finish

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmv-expand-all.yml
      - updates/apply-pwa-finish.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-pwa-finish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804
          path: prod

      - name: Check out patch script
        uses: actions/checkout@v4
        with:
          ref: master
          path: control

      - name: Apply PWA patch
        run: python3 control/updates/apply-pwa-finish.py prod

      - name: Verify PWA patch
        working-directory: prod
        run: |
          grep -n "pwaInstallBtn\|pwaInstallModal\|pwa.js" index.html
          grep -n "safe-area-inset" index.html
          grep -n '"shortcuts"' manifest.webmanifest
          grep -n "tmv-pwa-v9\|/pwa.js" sw.js
          test -f pwa.js
          git diff --check

      - name: Commit and push production branch
        working-directory: prod
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md index.html
          git commit -m "Finish mobile PWA install experience"
          git push origin HEAD:ms02-live-sync-20260908-085804
