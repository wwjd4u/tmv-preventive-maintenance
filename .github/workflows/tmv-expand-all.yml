name: Apply TMV Drag Task Ordering

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmv-expand-all.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-drag-order:
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronized live branch
        uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804

      - name: Replace arrow ordering with drag and drop
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('db-viewer.html')
          text = p.read_text()

          old_row = '''          html += '<div class="taskline">' +\n            '<span class="tlabel">' + esc(label) + '</span>' +\n            '<select class="ttype-sel" onchange="changeTaskType(' + ci + ',' + ii + ',this.value)">' +\n              taskTypeOptions(type) +\n            '</select>' +\n            '<button class="btn sm ghost" title="Move up" onclick="moveTask(' + ci + ',' + ii + ',-1)"' + (ii===0?' disabled':'') + '>↑</button>' +\n            '<button class="btn sm ghost" title="Move down" onclick="moveTask(' + ci + ',' + ii + ',1)"' + (ii===items.length-1?' disabled':'') + '>↓</button>' +\n            '<button class="btn sm danger" onclick="deleteTask(' + ci + ',' + ii + ')">×</button>' +\n          '</div>';'''

          new_row = '''          html += '<div class="taskline" draggable="true" data-ci="' + ci + '" data-ii="' + ii + '" ondragstart="taskDragStart(event,' + ci + ',' + ii + ')" ondragover="taskDragOver(event,' + ci + ',' + ii + ')" ondragleave="taskDragLeave(event)" ondrop="taskDrop(event,' + ci + ',' + ii + ')" ondragend="taskDragEnd(event)">' +\n            '<span class="taskdrag" title="Drag to reorder" style="cursor:grab;font-size:18px;line-height:1;user-select:none;padding:0 6px">⋮⋮</span>' +\n            '<span class="tlabel">' + esc(label) + '</span>' +\n            '<select class="ttype-sel" onchange="changeTaskType(' + ci + ',' + ii + ',this.value)">' +\n              taskTypeOptions(type) +\n            '</select>' +\n            '<button class="btn sm danger" onclick="deleteTask(' + ci + ',' + ii + ')">×</button>' +\n          '</div>';'''

          if old_row not in text:
              raise SystemExit('Expected arrow-button task row not found')
          text = text.replace(old_row, new_row, 1)

          old_move = '''function moveTask(ci, ii, dir){\n  var cfg = dbData.config;\n  var cat = cfg.checklist && cfg.checklist[ci];\n  if(!cat || typeof cat==='string' || !Array.isArray(cat.items)) return;\n  var ni = ii + dir;\n  if(ni < 0 || ni >= cat.items.length) return;\n  var tmp = cat.items[ii];\n  cat.items[ii] = cat.items[ni];\n  cat.items[ni] = tmp;\n  _openCats[ci] = true;\n  saveConfigArray('checklist', cfg.checklist);\n}\n'''

          new_drag = '''var _taskDrag = null;\nfunction clearTaskDropLines(){\n  document.querySelectorAll('.taskline').forEach(function(el){\n    el.style.borderTop = '';\n    el.style.borderBottom = '';\n    el.style.opacity = '';\n  });\n}\nfunction taskDragStart(e, ci, ii){\n  _taskDrag = {ci:ci, ii:ii};\n  if(e.dataTransfer){\n    e.dataTransfer.effectAllowed = 'move';\n    try{ e.dataTransfer.setData('text/plain', ci + ':' + ii); }catch(_e){}\n  }\n  e.currentTarget.style.opacity = '0.45';\n}\nfunction taskDragOver(e, ci, ii){\n  if(!_taskDrag || _taskDrag.ci !== ci) return;\n  e.preventDefault();\n  if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';\n  clearTaskDropLines();\n  var r = e.currentTarget.getBoundingClientRect();\n  var after = e.clientY > (r.top + r.height / 2);\n  e.currentTarget.style.borderTop = after ? '' : '3px solid #812F2F';\n  e.currentTarget.style.borderBottom = after ? '3px solid #812F2F' : '';\n}\nfunction taskDragLeave(e){\n  e.currentTarget.style.borderTop = '';\n  e.currentTarget.style.borderBottom = '';\n}\nfunction taskDrop(e, ci, ii){\n  if(!_taskDrag || _taskDrag.ci !== ci) return;\n  e.preventDefault();\n  var cfg = dbData.config;\n  var cat = cfg.checklist && cfg.checklist[ci];\n  if(!cat || typeof cat==='string' || !Array.isArray(cat.items)) return;\n  var r = e.currentTarget.getBoundingClientRect();\n  var after = e.clientY > (r.top + r.height / 2);\n  var from = _taskDrag.ii;\n  var insertAt = ii + (after ? 1 : 0);\n  var moved = cat.items.splice(from, 1)[0];\n  if(from < insertAt) insertAt--;\n  if(insertAt < 0) insertAt = 0;\n  if(insertAt > cat.items.length) insertAt = cat.items.length;\n  cat.items.splice(insertAt, 0, moved);\n  _openCats[ci] = true;\n  _taskDrag = null;\n  clearTaskDropLines();\n  saveConfigArray('checklist', cfg.checklist);\n}\nfunction taskDragEnd(){\n  _taskDrag = null;\n  clearTaskDropLines();\n}\n'''

          if old_move not in text:
              raise SystemExit('Expected moveTask function not found')
          text = text.replace(old_move, new_drag, 1)

          p.write_text(text)
          PY

      - name: Verify drag and drop UI
        shell: bash
        run: |
          grep -q 'draggable="true"' db-viewer.html
          grep -q 'taskDragStart' db-viewer.html
          grep -q 'taskDragOver' db-viewer.html
          grep -q 'taskDrop' db-viewer.html
          grep -q '3px solid #812F2F' db-viewer.html
          ! grep -q 'title="Move up"' db-viewer.html
          ! grep -q 'title="Move down"' db-viewer.html

      - name: Commit only db-viewer update
        shell: bash
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add db-viewer.html
          if git diff --cached --quiet; then
            echo "No source change required."
          else
            git commit -m "Replace task arrows with drag and drop ordering"
            git push origin HEAD:ms02-live-sync-20260908-085804
          fi
