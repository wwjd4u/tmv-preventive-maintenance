name: Apply TMV Task Reorder

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmv-expand-all.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-task-reorder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TMV layout branch
        uses: actions/checkout@v4
        with:
          ref: tmv-layout-recovery

      - name: Add task move up and down controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('db-viewer.html')
          text=p.read_text()
          old='''            '<select class="ttype-sel" onchange="changeTaskType(' + ci + ',' + ii + ',this.value)">' +\n              taskTypeOptions(type) +\n            '</select>' +\n            '<button class="btn sm danger" onclick="deleteTask(' + ci + ',' + ii + ')">×</button>' +'''
          new='''            '<select class="ttype-sel" onchange="changeTaskType(' + ci + ',' + ii + ',this.value)">' +\n              taskTypeOptions(type) +\n            '</select>' +\n            '<button class="btn sm ghost" title="Move up" onclick="moveTask(' + ci + ',' + ii + ',-1)"' + (ii===0?' disabled':'') + '>↑</button>' +\n            '<button class="btn sm ghost" title="Move down" onclick="moveTask(' + ci + ',' + ii + ',1)"' + (ii===items.length-1?' disabled':'') + '>↓</button>' +\n            '<button class="btn sm danger" onclick="deleteTask(' + ci + ',' + ii + ')">×</button>' +'''
          if old in text:
              text=text.replace(old,new,1)
          elif 'onclick="moveTask(' not in text:
              raise SystemExit('task button insertion point not found')

          old2='''function changeTaskType(ci, ii, val){\n  var cfg = dbData.config;\n  var cat = cfg.checklist[ci];\n  if(!cat || typeof cat==='string') return;\n  if(!cat.items[ii]) return;\n  cat.items[ii].type = val;\n  saveConfigArray('checklist', cfg.checklist);\n}\n'''
          new2=old2+'''function moveTask(ci, ii, dir){\n  var cfg = dbData.config;\n  var cat = cfg.checklist && cfg.checklist[ci];\n  if(!cat || typeof cat==='string' || !Array.isArray(cat.items)) return;\n  var ni = ii + dir;\n  if(ni < 0 || ni >= cat.items.length) return;\n  var tmp = cat.items[ii];\n  cat.items[ii] = cat.items[ni];\n  cat.items[ni] = tmp;\n  _openCats[ci] = true;\n  saveConfigArray('checklist', cfg.checklist);\n}\n'''
          if old2 in text and 'function moveTask(ci, ii, dir)' not in text:
              text=text.replace(old2,new2,1)
          p.write_text(text)
          PY

      - name: Verify UI patch
        shell: bash
        run: |
          grep -q 'function moveTask(ci, ii, dir)' db-viewer.html
          grep -q 'title="Move up"' db-viewer.html
          grep -q 'title="Move down"' db-viewer.html

      - name: Commit patched admin page
        shell: bash
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add db-viewer.html
          if git diff --cached --quiet; then
            echo "No source change required."
            exit 0
          fi
          git commit -m "Add task reorder controls"
          git push origin HEAD:tmv-layout-recovery
