name: Apply TMV Auth Idle Timeout

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmv-expand-all.yml
      - updates/apply-auth-idle-env.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-auth-idle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804
          path: prod

      - name: Check out patch script
        uses: actions/checkout@v4
        with:
          ref: master
          path: control

      - name: Apply auth patch
        run: python3 control/updates/apply-auth-idle-env.py prod

      - name: Verify auth patch
        working-directory: prod
        run: |
          grep -n "ADMIN_USER = String(process.env.ADMIN_USER" api-server.js
          grep -n "AUTH_IDLE_MINUTES\|AUTH_IDLE_MS" api-server.js
          grep -n "Signed out after 15 minutes of inactivity" app.js db-viewer.html
          grep -n "app.js?v=20260908AUTH3" index.html
          if grep -n "const ADMIN_PASS = '" api-server.js; then
            echo "Hardcoded admin password still present"
            exit 1
          fi
          git diff --check

      - name: Commit and push production branch
        working-directory: prod
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md api-server.js app.js db-viewer.html index.html
          git commit -m "Add 15 minute auth idle timeout"
          git push origin HEAD:ms02-live-sync-20260908-085804
