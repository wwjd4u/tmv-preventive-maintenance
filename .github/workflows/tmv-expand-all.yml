name: Apply TMV Superuser Manager Permissions

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmv-expand-all.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-role-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronized live branch
        uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804

      - name: Apply role-aware backend and Setup permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------------- api-server.js ----------------
          p = Path('api-server.js')
          text = p.read_text()

          old_auth = '''// ── Admin auth ────────────────────────────────────────────\n// Token is base64("<user>:<pass>"); sent in `Authorization: Bearer <token>`.\nfunction adminToken() {\n  return Buffer.from(`${ADMIN_USER}:${ADMIN_PASS}`).toString('base64');\n}\nfunction isAdmin(token) {\n  return token === adminToken();\n}\n'''
          new_auth = '''// ── Role-aware auth sessions ───────────────────────────────\n// Built-in admin is the Superuser. Saved manager accounts receive Manager\n// sessions. Tokens are random server-side session IDs, not reusable admin creds.\nconst authSessions = new Map();\nfunction newAuthSession(role, username, name) {\n  const token = crypto.randomBytes(32).toString('hex');\n  authSessions.set(token, { role, username, name: name || username, createdAt: Date.now() });\n  return token;\n}\nfunction getAuthSession(token) {\n  return token ? (authSessions.get(token) || null) : null;\n}\nfunction isAdmin(token) {\n  const s = getAuthSession(token);\n  return !!s && (s.role === 'superuser' || s.role === 'manager');\n}\n'''
          if old_auth not in text:
              raise SystemExit('admin auth block not found')
          text = text.replace(old_auth, new_auth, 1)

          old_login = '''        if (d.username === ADMIN_USER && d.password === ADMIN_PASS) {\n          return sendJson(res, 200, { ok: true, token: adminToken() });\n        }\n        // Manager login: a saved manager with a matching password gets full admin token.\n        const cfgMgr = (loadConfig() || {}).managers || [];\n        const mgr = cfgMgr.find(m => (m.username || m.name) === d.username);\n        if (mgr && verifyPassword(d.password || '', mgr.password)) {\n          return sendJson(res, 200, { ok: true, token: adminToken(), manager: mgr.name || mgr.username });\n        }\n'''
          new_login = '''        if (d.username === ADMIN_USER && d.password === ADMIN_PASS) {\n          const token = newAuthSession('superuser', ADMIN_USER, 'Superuser');\n          return sendJson(res, 200, { ok: true, token, role: 'superuser', name: 'Superuser' });\n        }\n        // Saved manager login receives a Manager session with restricted Setup rights.\n        const cfgMgr = (loadConfig() || {}).managers || [];\n        const mgr = cfgMgr.find(m => (m.username || m.name) === d.username);\n        if (mgr && verifyPassword(d.password || '', mgr.password)) {\n          const token = newAuthSession('manager', mgr.username || mgr.name, mgr.name || mgr.username);\n          return sendJson(res, 200, { ok: true, token, role: 'manager', name: mgr.name || mgr.username });\n        }\n'''
          if old_login not in text:
              raise SystemExit('login role block not found')
          text = text.replace(old_login, new_login, 1)

          old_req = '''  const authHeader = req.headers['authorization'] || '';\n  const reqToken = authHeader.startsWith('Bearer ') ? authHeader.slice(7) : '';\n  const isAdminReq = isAdmin(reqToken);\n'''
          new_req = '''  const authHeader = req.headers['authorization'] || '';\n  const reqToken = authHeader.startsWith('Bearer ') ? authHeader.slice(7) : '';\n  const authSession = getAuthSession(reqToken);\n  const isSuperuserReq = !!authSession && authSession.role === 'superuser';\n  const isManagerReq = !!authSession && authSession.role === 'manager';\n  const isAdminReq = isSuperuserReq || isManagerReq; // operational admin access\n'''
          if old_req not in text:
              raise SystemExit('request auth block not found')
          text = text.replace(old_req, new_req, 1)

          old_db = '''  if (url.pathname === '/api/admin/db' && req.method === 'GET') {\n    if (!isAdminReq) return sendJson(res, 401, { error: 'Admin required' });\n    const dump = db.getAdminDump();\n    return sendJson(res, 200, { ...dump, dbFile: DB_PATH });\n  }\n'''
          new_db = '''  if (url.pathname === '/api/admin/db' && req.method === 'GET') {\n    if (!isAdminReq) return sendJson(res, 401, { error: 'Manager or Superuser required' });\n    const dump = db.getAdminDump();\n    return sendJson(res, 200, { ...dump, dbFile: DB_PATH, auth: { role: authSession.role, name: authSession.name } });\n  }\n'''
          if old_db not in text:
              raise SystemExit('admin db block not found')
          text = text.replace(old_db, new_db, 1)

          text = text.replace("if (!isAdminReq) return sendJson(res, 401, { error: 'Admin required' });\n    db.purgeAssignments();", "if (!isSuperuserReq) return sendJson(res, 403, { error: 'Superuser required' });\n    db.purgeAssignments();", 1)
          text = text.replace("if (!isAdminReq) return sendJson(res, 401, { error: 'Admin required' });\n    const config = loadConfig();", "if (!isSuperuserReq) return sendJson(res, 403, { error: 'Superuser required' });\n    const config = loadConfig();", 1)

          old_config = '''  if (url.pathname === '/api/config' && req.method === 'PUT') {\n    if (!isAdminReq) return sendJson(res, 401, { error: 'Admin required' });\n    let body = '';\n    req.on('data', c => body += c);\n    req.on('end', () => {\n      try {\n        const incoming = JSON.parse(body);\n        const config = loadConfig() || {};\n        // Merge: keep any existing keys not present in the incoming payload,\n        // then overwrite with whatever the client sent (full-save model).\n        const merged = { ...config, ...incoming };\n        saveConfig(merged);\n        sendJson(res, 200, { ok: true, config: merged });\n      } catch(e) { sendJson(res, 400, { error: e.message }); }\n    });\n    return;\n  }\n'''
          new_config = '''  if (url.pathname === '/api/config' && req.method === 'PUT') {\n    if (!isAdminReq) return sendJson(res, 401, { error: 'Manager or Superuser required' });\n    let body = '';\n    req.on('data', c => body += c);\n    req.on('end', () => {\n      try {\n        const incoming = JSON.parse(body);\n        const config = loadConfig() || {};\n        let merged;\n        if (isSuperuserReq) {\n          merged = { ...config, ...incoming };\n        } else {\n          // Managers may operate Setup, but cannot modify Maintenance Categories\n          // and cannot delete Setup data other than Technicians.\n          merged = { ...config, ...incoming };\n          merged.checklist = config.checklist || [];\n\n          const oldLoc = Array.isArray(config.locations) ? config.locations : [];\n          const newLoc = Array.isArray(incoming.locations) ? incoming.locations : oldLoc;\n          merged.locations = oldLoc.concat(newLoc.filter(x => oldLoc.indexOf(x) < 0));\n\n          const oldDistricts = Array.isArray(config.districts) ? config.districts : [];\n          const newDistricts = Array.isArray(incoming.districts) ? incoming.districts : oldDistricts;\n          merged.districts = oldDistricts.concat(newDistricts.filter(x => oldDistricts.indexOf(x) < 0));\n\n          const oldIntervals = Array.isArray(config.intervals) ? config.intervals : [];\n          const newIntervals = Array.isArray(incoming.intervals) ? incoming.intervals : oldIntervals;\n          merged.intervals = oldIntervals.concat(newIntervals.filter(x => oldIntervals.indexOf(x) < 0));\n\n          const oldUnits = Array.isArray(config.unitOptions) ? config.unitOptions : [];\n          const newUnits = Array.isArray(incoming.unitOptions) ? incoming.unitOptions : oldUnits;\n          merged.unitOptions = oldUnits.concat(newUnits.filter(x => oldUnits.indexOf(x) < 0));\n\n          merged.tmvVanMap = { ...(config.tmvVanMap || {}), ...(incoming.tmvVanMap || {}) };\n          merged.geofences = { ...(config.geofences || {}), ...(incoming.geofences || {}) };\n          // Technicians are the one Setup list Managers may add/edit/delete.\n          if (Array.isArray(incoming.technicians)) merged.technicians = incoming.technicians;\n        }\n        saveConfig(merged);\n        sendJson(res, 200, { ok: true, config: merged });\n      } catch(e) { sendJson(res, 400, { error: e.message }); }\n    });\n    return;\n  }\n'''
          if old_config not in text:
              raise SystemExit('config PUT block not found')
          text = text.replace(old_config, new_config, 1)

          old_mgr_gate = "  // ── PUT /api/managers — save managers with hashed passwords (admin only) ──\n  if (url.pathname === '/api/managers' && req.method === 'PUT') {\n    if (!isAdminReq) return sendJson(res, 401, { error: 'Admin required' });"
          new_mgr_gate = "  // ── PUT /api/managers — Superuser full control; Managers may add/update but not remove ──\n  if (url.pathname === '/api/managers' && req.method === 'PUT') {\n    if (!isAdminReq) return sendJson(res, 401, { error: 'Manager or Superuser required' });"
          if old_mgr_gate not in text:
              raise SystemExit('manager route gate not found')
          text = text.replace(old_mgr_gate, new_mgr_gate, 1)

          old_mgr_current = '''        const current = (loadConfig() || {}).managers || [];\n        const savedByName = {};\n'''
          new_mgr_current = '''        const current = (loadConfig() || {}).managers || [];\n        if (isManagerReq) {\n          const incomingKeys = new Set(incoming.map(m => m.username || m.name));\n          const removed = current.some(m => !incomingKeys.has(m.username || m.name));\n          if (removed) return sendJson(res, 403, { error: 'Managers may add or update managers but cannot delete managers' });\n        }\n        const savedByName = {};\n'''
          if old_mgr_current not in text:
              raise SystemExit('manager current list block not found')
          text = text.replace(old_mgr_current, new_mgr_current, 1)

          old_mgr_return = '''          return { name, username, password };\n'''
          new_mgr_return = '''          return { name, username, password, role: 'manager' };\n'''
          if old_mgr_return not in text:
              raise SystemExit('manager object return not found')
          text = text.replace(old_mgr_return, new_mgr_return, 1)

          text = text.replace("if (!isAdminReq) return sendJson(res, 401, { error: 'Admin required to add assets' });", "if (!isAdminReq) return sendJson(res, 401, { error: 'Manager or Superuser required to add assets' });", 1)
          text = text.replace("  if (delMatch && req.method === 'DELETE') {\n    if (!isAdminReq) return sendJson(res, 401, { error: 'Admin required to delete assets' });", "  if (delMatch && req.method === 'DELETE') {\n    if (!isSuperuserReq) return sendJson(res, 403, { error: 'Superuser required to delete assets' });", 1)

          p.write_text(text)

          # ---------------- db-viewer.html ----------------
          p = Path('db-viewer.html')
          text = p.read_text()

          text = text.replace('<h2>Admin Login</h2>', '<h2>Superuser / Manager Login</h2>', 1)
          text = text.replace('<h1>TMV Preventive Maintenance Admin</h1>', '<h1>TMV Preventive Maintenance</h1>', 1)
          text = text.replace('let token = null;\nlet dbData', "let token = null;\nlet currentRole = '';\nlet currentUserName = '';\nlet dbData", 1)

          old_login_ui = "      if(d.token){ token = d.token; document.getElementById('loginOverlay').style.display='none'; loadData(); }"
          new_login_ui = "      if(d.token){ token = d.token; currentRole = d.role || ''; currentUserName = d.name || ''; document.getElementById('loginOverlay').style.display='none'; applyRoleUi(); loadData(); }"
          if old_login_ui not in text:
              raise SystemExit('db login success line not found')
          text = text.replace(old_login_ui, new_login_ui, 1)

          insert_after = "function authHdr(){ return { 'Authorization': 'Bearer ' + token } }\n"
          role_ui = '''function authHdr(){ return { 'Authorization': 'Bearer ' + token } }\nfunction isSuperuser(){ return currentRole === 'superuser'; }\nfunction applyRoleUi(){\n  var manager = currentRole === 'manager';\n  var cat = document.querySelector('.catblock');\n  if(cat) cat.style.display = manager ? 'none' : '';\n  ['deleteTmv()','deleteLoc()','deleteMgr()','purgeData()'].forEach(function(call){\n    document.querySelectorAll('[onclick="'+call+'"]').forEach(function(el){ el.style.display = manager ? 'none' : ''; });\n  });\n  // Technician delete remains available to Managers by design.\n  var label = document.getElementById('roleLabel');\n  if(!label){\n    label = document.createElement('span');\n    label.id = 'roleLabel';\n    label.style.cssText = 'margin-left:10px;font-size:12px;opacity:.85';\n    var nav = document.querySelector('header nav');\n    if(nav) nav.appendChild(label);\n  }\n  if(label) label.textContent = currentRole ? (currentRole === 'superuser' ? 'Superuser' : 'Manager') + (currentUserName ? ' — ' + currentUserName : '') : '';\n}\n'''
          if insert_after not in text:
              raise SystemExit('authHdr insertion point not found')
          text = text.replace(insert_after, role_ui, 1)

          old_data_assign = '''      dbData = d;\n      try { renderStats(); } catch(e){ console.error('renderStats', e); }'''
          new_data_assign = '''      dbData = d;\n      if(d.auth && d.auth.role){ currentRole = d.auth.role; currentUserName = d.auth.name || currentUserName; }\n      applyRoleUi();\n      try { renderStats(); } catch(e){ console.error('renderStats', e); }'''
          if old_data_assign not in text:
              raise SystemExit('loadData assignment block not found')
          text = text.replace(old_data_assign, new_data_assign, 1)

          # Managers can modify assignments operationally, including delete/reassign.
          # Setup delete buttons except Technician are hidden in applyRoleUi.
          p.write_text(text)

          # ---------------- CHANGELOG.md ----------------
          p = Path('CHANGELOG.md')
          text = p.read_text() if p.exists() else '# TMV Preventive Maintenance App — Change Log\n\n'
          marker = '## 2026-09-08\n'
          entry = '''## 2026-09-08\n\n### Superuser and Manager role separation\n- Changed the built-in admin account into the **Superuser** role with full read/write/delete control.\n- Added true Manager login sessions with separate credentials stored in the existing Managers Setup section.\n- Managers can operate Assignments/Tracker/technician workflows.\n- In Setup, Managers can add/edit/delete Technicians; add/update Managers; add/edit Equipment; add/edit Districts; and add Inspection Settings.\n- Managers cannot delete Setup records other than Technicians.\n- Managers cannot access or modify Maintenance Categories.\n- Maintenance Categories and destructive Setup actions remain Superuser-only.\n- Backend API checks enforce these limits in addition to hiding restricted Setup controls in the UI.\n- Technician work-link behavior remains limited to the technician's assigned work and was not changed by this update.\n- Deployment status: **GitHub implementation pending MS-02 deployment verification.**\n\n'''
          if '### Superuser and Manager role separation' not in text:
              if marker in text:
                  text = text.replace(marker, entry, 1)
              else:
                  text = entry + text
          p.write_text(text)
          PY

      - name: Validate role implementation
        shell: bash
        run: |
          node --check api-server.js
          grep -q "newAuthSession('superuser'" api-server.js
          grep -q "newAuthSession('manager'" api-server.js
          grep -q "const isSuperuserReq" api-server.js
          grep -q "Managers may add or update managers but cannot delete managers" api-server.js
          grep -q "merged.checklist = config.checklist" api-server.js
          grep -q "Superuser required to delete assets" api-server.js
          grep -q "function applyRoleUi" db-viewer.html
          grep -q "Superuser / Manager Login" db-viewer.html
          grep -q "Technician delete remains available" db-viewer.html
          grep -q "Superuser and Manager role separation" CHANGELOG.md

      - name: Show changed files
        shell: bash
        run: git diff --name-status

      - name: Commit role permissions and notes
        shell: bash
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add api-server.js db-viewer.html CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No source change required."
          else
            git commit -m "Add Superuser and Manager permissions"
            git push origin HEAD:ms02-live-sync-20260908-085804
          fi
