name: Apply TMV SMS Preferences UI

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmv-expand-all.yml
      - updates/apply-sms-preferences-ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-sms-preferences:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804
          path: prod

      - name: Check out patch script
        uses: actions/checkout@v4
        with:
          ref: master
          path: control

      - name: Apply patch
        run: python3 control/updates/apply-sms-preferences-ui.py prod

      - name: Verify patch
        working-directory: prod
        run: |
          grep -n "openSmsPreferences\|mgrPhone" db-viewer.html
          grep -n "URLSearchParams(location.search)" sms-consent.js
          grep -n "technician or manager roster" sms-consent-server.js
          git diff --check

      - name: Commit and push production branch
        working-directory: prod
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md api-server.js db-viewer.html sms-consent.html sms-consent.js sms-consent-server.js
          git commit -m "Expose SMS preferences in setup"
          git push origin HEAD:ms02-live-sync-20260908-085804
