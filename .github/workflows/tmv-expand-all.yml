name: Apply TMV Login Logout Flow

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmv-expand-all.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-auth-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronized live branch
        uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804

      - name: Apply real login logout flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- api-server.js ----------
          p = Path('api-server.js')
          text = p.read_text()

          login_end = """  // ── Admin-only endpoints below ───────────────────────────\n  // Check for Authorization header\n"""
          session_routes = """  // ── Auth session inspection / logout ─────────────────────\n  if (url.pathname === '/api/session' && req.method === 'GET') {\n    const auth = req.headers['authorization'] || '';\n    const tok = auth.startsWith('Bearer ') ? auth.slice(7) : '';\n    const session = getAuthSession(tok);\n    if (!session) return sendJson(res, 401, { error: 'Login required' });\n    return sendJson(res, 200, { ok: true, role: session.role, name: session.name, username: session.username });\n  }\n\n  if (url.pathname === '/api/logout' && req.method === 'POST') {\n    const auth = req.headers['authorization'] || '';\n    const tok = auth.startsWith('Bearer ') ? auth.slice(7) : '';\n    if (tok) authSessions.delete(tok);\n    return sendJson(res, 200, { ok: true });\n  }\n\n  // ── Admin-only endpoints below ───────────────────────────\n  // Check for Authorization header\n"""
          if "url.pathname === '/api/session'" not in text:
              if login_end not in text:
                  raise SystemExit('api session insertion point not found')
              text = text.replace(login_end, session_routes, 1)
          p.write_text(text)

          # ---------- index.html ----------
          p = Path('index.html')
          text = p.read_text()

          style_anchor = """  .header-right{margin-left:auto;display:flex;align-items:center;gap:12px}\n"""
          auth_css = """  .header-right{margin-left:auto;display:flex;align-items:center;gap:12px}\n  .auth-user{font-size:12px;background:rgba(255,255,255,.14);padding:6px 10px;border-radius:999px;white-space:nowrap}\n  .auth-logout{background:#fff;color:var(--cudd);border:0;padding:7px 12px;border-radius:8px;font-weight:700;cursor:pointer}\n  #appLoginOverlay{position:fixed;inset:0;z-index:5000;background:rgba(35,24,24,.72);display:flex;align-items:center;justify-content:center;padding:20px}\n  #appLoginBox{width:min(390px,100%);background:#fff;border-radius:14px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}\n  #appLoginBox h2{margin:0 0 6px;color:var(--cudd)}\n  #appLoginBox p{margin:0 0 16px;color:#666;font-size:13px}\n  #appLoginBox input{display:block;width:100%;margin:9px 0;padding:11px 12px}\n  #appLoginErr{min-height:20px;color:#b91c1c;font-size:13px;margin:4px 0 8px}\n"""
          if '#appLoginOverlay' not in text:
              if style_anchor not in text:
                  raise SystemExit('index auth css insertion point not found')
              text = text.replace(style_anchor, auth_css, 1)

          body_anchor = """<body>\n<header>\n"""
          login_html = """<body>\n<div id=\"appLoginOverlay\">\n  <div id=\"appLoginBox\">\n    <h2>TMV Preventive Maintenance</h2>\n    <p>Sign in as a Superuser or Manager.</p>\n    <input id=\"appLoginUser\" type=\"text\" placeholder=\"Username\" autocomplete=\"username\">\n    <input id=\"appLoginPass\" type=\"password\" placeholder=\"Password\" autocomplete=\"current-password\">\n    <div id=\"appLoginErr\"></div>\n    <button class=\"btn\" onclick=\"doAppLogin()\" style=\"width:100%\">Log In</button>\n  </div>\n</div>\n<header>\n"""
          if 'id="appLoginOverlay"' not in text:
              if body_anchor not in text:
                  raise SystemExit('index login overlay insertion point not found')
              text = text.replace(body_anchor, login_html, 1)

          old_role = """    <label class=\"role-toggle\">Role:\n      <select id=\"roleSel\">\n        <option value=\"admin\">Admin</option>\n        <option value=\"tech\">Tech</option>\n      </select>\n    </label>\n"""
          new_role = """    <span id=\"appAuthUser\" class=\"auth-user\"></span>\n    <button id=\"appLogoutBtn\" class=\"auth-logout\" onclick=\"appLogout()\">Log Out</button>\n"""
          if old_role in text:
              text = text.replace(old_role, new_role, 1)
          elif 'id="appAuthUser"' not in text:
              raise SystemExit('index role control not found')

          text = text.replace('app.js?v=20260904R3', 'app.js?v=20260908AUTH1')
          p.write_text(text)

          # ---------- app.js ----------
          p = Path('app.js')
          text = p.read_text()

          old_role_block = """var ROLE = localStorage.getItem('tmv_role') || 'admin';\nfunction isAdmin(){ return ROLE === 'admin'; }\nfunction applyRole(){\n  var sel = document.getElementById('roleSel');\n  if(sel) sel.value = ROLE;\n  var db = document.getElementById('tabDb');\n  if(db) db.style.display = isAdmin() ? '' : 'none';\n}\n\nasync function boot(){\n  try{\n    await loadConfig();\n    loadPositions();              // fire-and-forget: proxied DevIoT feed; never blocks boot\n    await loadAssets();\n    await loadAssignments();\n    buildTracker();\n    buildTechFilter();\n    buildTmvGrid();\n    buildTechSelect();\n    applyRole();\n    if (__geoDemoMode) { var db = document.getElementById('demoBanner'); if (db) db.classList.remove('hidden'); }\n    // Honor #tracker / #tmv deep links (e.g. \"Back to Tracker\" from assign.html)\n    showViewFromHash();\n    window.addEventListener('hashchange', showViewFromHash);\n  }catch(e){ showErr('boot failed: '+((e&&(e.stack||e.message))||e)); }\n}\n"""
          new_role_block = """var APP_TOKEN = sessionStorage.getItem('tmv_auth_token') || '';\nvar APP_ROLE = sessionStorage.getItem('tmv_auth_role') || '';\nvar APP_USER = sessionStorage.getItem('tmv_auth_name') || '';\n\nfunction appAuthHeaders(extra){\n  var h = Object.assign({}, extra || {});\n  if(APP_TOKEN) h.Authorization = 'Bearer ' + APP_TOKEN;\n  return h;\n}\nfunction updateAppAuthUi(){\n  var label = document.getElementById('appAuthUser');\n  if(label) label.textContent = APP_ROLE ? ((APP_ROLE === 'superuser' ? 'Superuser' : 'Manager') + (APP_USER ? ' — ' + APP_USER : '')) : '';\n}\nfunction showAppLogin(message){\n  var overlay = document.getElementById('appLoginOverlay');\n  if(overlay) overlay.style.display = 'flex';\n  var err = document.getElementById('appLoginErr');\n  if(err) err.textContent = message || '';\n}\nfunction hideAppLogin(){ var overlay=document.getElementById('appLoginOverlay'); if(overlay) overlay.style.display='none'; }\nfunction clearAppSession(){\n  APP_TOKEN=''; APP_ROLE=''; APP_USER='';\n  sessionStorage.removeItem('tmv_auth_token');\n  sessionStorage.removeItem('tmv_auth_role');\n  sessionStorage.removeItem('tmv_auth_name');\n}\nasync function doAppLogin(){\n  var u=(document.getElementById('appLoginUser').value||'').trim();\n  var p=document.getElementById('appLoginPass').value||'';\n  var err=document.getElementById('appLoginErr'); if(err) err.textContent='';\n  try{\n    var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});\n    var d=await r.json();\n    if(!r.ok || !d.token) throw new Error(d.error||'Invalid credentials');\n    APP_TOKEN=d.token; APP_ROLE=d.role||''; APP_USER=d.name||u;\n    sessionStorage.setItem('tmv_auth_token',APP_TOKEN);\n    sessionStorage.setItem('tmv_auth_role',APP_ROLE);\n    sessionStorage.setItem('tmv_auth_name',APP_USER);\n    document.getElementById('appLoginPass').value='';\n    await boot();\n  }catch(e){ showAppLogin(e.message||'Login failed'); }\n}\nasync function appLogout(){\n  try{ if(APP_TOKEN) await fetch('/api/logout',{method:'POST',headers:appAuthHeaders()}); }catch(_e){}\n  clearAppSession();\n  location.reload();\n}\n\nasync function boot(){\n  try{\n    if(!APP_TOKEN){ showAppLogin(); return; }\n    var sr=await fetch('/api/session',{headers:appAuthHeaders()});\n    if(!sr.ok){ clearAppSession(); showAppLogin('Please sign in.'); return; }\n    var sd=await sr.json();\n    APP_ROLE=sd.role||APP_ROLE; APP_USER=sd.name||APP_USER;\n    sessionStorage.setItem('tmv_auth_role',APP_ROLE);\n    sessionStorage.setItem('tmv_auth_name',APP_USER);\n    hideAppLogin(); updateAppAuthUi();\n    await loadConfig();\n    loadPositions();\n    await loadAssets();\n    await loadAssignments();\n    buildTracker();\n    buildTechFilter();\n    buildTmvGrid();\n    buildTechSelect();\n    if (__geoDemoMode) { var db = document.getElementById('demoBanner'); if (db) db.classList.remove('hidden'); }\n    showViewFromHash();\n    window.addEventListener('hashchange', showViewFromHash);\n  }catch(e){ showErr('boot failed: '+((e&&(e.stack||e.message))||e)); }\n}\n"""
          if old_role_block not in text:
              raise SystemExit('app legacy role/boot block not found')
          text = text.replace(old_role_block, new_role_block, 1)

          old_positions_auth = """    var user = sessionStorage.getItem('tmv_db_user'), pass = sessionStorage.getItem('tmv_db_pass');\n    var hdr = user && pass ? { 'Authorization': 'Basic ' + btoa(user + ':' + pass) } : {};\n    var r = await fetch('/api/positions', { headers: hdr });\n"""
          new_positions_auth = """    var r = await fetch('/api/positions', { headers: appAuthHeaders() });\n"""
          if old_positions_auth not in text:
              raise SystemExit('app legacy positions auth block not found')
          text = text.replace(old_positions_auth, new_positions_auth, 1)

          old_godb = """function goDb(){\n  sessionStorage.setItem(\"tmv_db_user\", \"admin\");\n  sessionStorage.setItem(\"tmv_db_pass\", \"admin123\");\n  window.open(\"/db?autologin=1\", \"_blank\");\n}\n\n// ── Auth removed: app opens directly to the TMV grid ─────\n"""
          new_godb = """function goDb(){\n  if(!APP_TOKEN){ showAppLogin('Please sign in first.'); return; }\n  window.open('/db?session=1', '_blank');\n}\n\n// Main desktop app requires a Superuser or Manager session.\n"""
          if old_godb not in text:
              raise SystemExit('app legacy Task.db auth block not found')
          text = text.replace(old_godb, new_godb, 1)

          p.write_text(text)

          # ---------- db-viewer.html ----------
          p = Path('db-viewer.html')
          text = p.read_text()

          text = text.replace('placeholder="Username" value="admin"', 'placeholder="Username"', 1)
          text = text.replace('placeholder="Password" value="admin123"', 'placeholder="Password"', 1)

          old_nav = """    <a class=\"backbtn\" href=\"/\" title=\"Back to main app\">← Main App</a>\n  </nav>\n"""
          new_nav = """    <a class=\"backbtn\" href=\"/\" title=\"Back to main app\">← Main App</a>\n    <button class=\"btn sm ghost\" onclick=\"dbLogout()\">Log Out</button>\n  </nav>\n"""
          if 'onclick="dbLogout()"' not in text:
              if old_nav not in text:
                  raise SystemExit('db logout nav insertion point not found')
              text = text.replace(old_nav, new_nav, 1)

          old_success = """      if(d.token){ token = d.token; currentRole = d.role || ''; currentUserName = d.name || ''; document.getElementById('loginOverlay').style.display='none'; applyRoleUi(); loadData(); }\n"""
          new_success = """      if(d.token){ token = d.token; currentRole = d.role || ''; currentUserName = d.name || ''; sessionStorage.setItem('tmv_auth_token', token); sessionStorage.setItem('tmv_auth_role', currentRole); sessionStorage.setItem('tmv_auth_name', currentUserName); document.getElementById('loginOverlay').style.display='none'; applyRoleUi(); loadData(); }\n"""
          if old_success not in text:
              raise SystemExit('db login success block not found')
          text = text.replace(old_success, new_success, 1)

          old_auto = """// Auto-login from Task.db button (?autologin=1)\n(function(){\n  if(location.search.includes('autologin=1')){\n    var u = sessionStorage.getItem('tmv_db_user');\n    var p = sessionStorage.getItem('tmv_db_pass');\n    if(u && p){\n      document.getElementById('user').value = u;\n      document.getElementById('pass').value = p;\n      setTimeout(doLogin, 100);\n    }\n  }\n})();\n\n"""
          new_auto = """// Reuse the current authenticated app session when Task.db is opened.\n(function(){\n  var shared = sessionStorage.getItem('tmv_auth_token');\n  if(!shared) return;\n  fetch('/api/session', { headers:{'Authorization':'Bearer '+shared} })\n    .then(function(r){ if(!r.ok) throw new Error('expired'); return r.json(); })\n    .then(function(d){\n      token = shared; currentRole = d.role || ''; currentUserName = d.name || '';\n      document.getElementById('loginOverlay').style.display='none';\n      applyRoleUi(); loadData();\n    })\n    .catch(function(){ sessionStorage.removeItem('tmv_auth_token'); sessionStorage.removeItem('tmv_auth_role'); sessionStorage.removeItem('tmv_auth_name'); });\n})();\n\nfunction dbLogout(){\n  var headers = token ? {'Authorization':'Bearer '+token} : {};\n  fetch('/api/logout', {method:'POST', headers:headers}).catch(function(){}).finally(function(){\n    token=null; currentRole=''; currentUserName='';\n    sessionStorage.removeItem('tmv_auth_token');\n    sessionStorage.removeItem('tmv_auth_role');\n    sessionStorage.removeItem('tmv_auth_name');\n    document.getElementById('user').value='';\n    document.getElementById('pass').value='';\n    document.getElementById('loginOverlay').style.display='flex';\n  });\n}\n\n"""
          if old_auto not in text:
              raise SystemExit('db legacy autologin block not found')
          text = text.replace(old_auto, new_auto, 1)
          p.write_text(text)

          # ---------- CHANGELOG.md ----------
          p = Path('CHANGELOG.md')
          text = p.read_text()
          marker = '## 2026-09-08\n'
          entry = """## 2026-09-08\n\n### Completed application login and logout flow\n- Removed the legacy browser code that automatically stored and reused the built-in admin credentials.\n- Removed the fake Admin/Tech role selector from the desktop application.\n- Added a real Superuser / Manager login screen to the main desktop application.\n- Added a signed-in role/name indicator and **Log Out** button.\n- Added server-side session validation and logout endpoints.\n- Task.db now reuses the active authenticated session token instead of storing a username/password in session storage.\n- Task.db also has its own **Log Out** button and blank credential fields when no session exists.\n- Technician work-order links remain separate from Superuser/Manager login.\n- Deployment status: **GitHub implementation pending MS-02 deployment verification.**\n\n"""
          if '### Completed application login and logout flow' not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG date marker not found')
              text = text.replace(marker, entry, 1)
          p.write_text(text)
          PY

      - name: Validate auth implementation
        shell: bash
        run: |
          node --check api-server.js
          grep -q "url.pathname === '/api/session'" api-server.js
          grep -q "url.pathname === '/api/logout'" api-server.js
          grep -q 'id="appLoginOverlay"' index.html
          grep -q 'onclick="appLogout()"' index.html
          grep -q 'function doAppLogin' app.js
          grep -q 'function appLogout' app.js
          grep -q "sessionStorage.setItem('tmv_auth_token'" app.js
          grep -q "window.open('/db?session=1'" app.js
          grep -q 'onclick="dbLogout()"' db-viewer.html
          grep -q 'function dbLogout' db-viewer.html
          ! grep -q 'tmv_db_pass' app.js
          ! grep -q 'value="admin123"' db-viewer.html
          ! grep -q 'id="roleSel"' index.html

      - name: Commit application auth flow
        shell: bash
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add api-server.js index.html app.js db-viewer.html CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No source change required."
          else
            git commit -m "Complete app login and logout flow"
            git push origin HEAD:ms02-live-sync-20260908-085804
          fi
