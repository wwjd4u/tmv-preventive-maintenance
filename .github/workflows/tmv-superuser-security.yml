name: Apply TMV Superuser Security

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/tmv-superuser-security.yml
      - updates/apply-superuser-security.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-superuser-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804
          path: prod

      - name: Check out patch script
        uses: actions/checkout@v4
        with:
          ref: master
          path: control

      - name: Apply Superuser security patch
        run: python3 control/updates/apply-superuser-security.py prod

      - name: Verify patch
        working-directory: prod
        run: |
          grep -n "api/superuser/credentials\|validAdminPassword\|updatePrivateEnv" api-server.js
          grep -n "superuserSecurityBlock\|saveSuperuserCredentials\|Update Superuser Login" db-viewer.html
          git diff --check

      - name: Commit and push production branch
        working-directory: prod
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md api-server.js db-viewer.html
          git commit -m "Add Superuser credential rotation"
          git push origin HEAD:ms02-live-sync-20260908-085804
