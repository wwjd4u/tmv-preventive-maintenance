name: Apply TMV Task Selection and Password Confirmation

on:
  push:
    branches: [ master ]
    paths:
      - 'updates/add-task-selection-password-confirm.py'
      - '.github/workflows/tmv-task-selection-password-confirm.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: git show origin/master:updates/add-task-selection-password-confirm.py > /tmp/patch.py
      - run: python3 /tmp/patch.py
      - name: Verify
        run: |
          grep -n "task-check\|selectedTaskLabels" work-order-builder.js
          grep -n "selectedTaskLabels" work-orders.js
          grep -n "mgrPassConfirm\|techPassConfirm\|passwords do not match" db-viewer.html
          node --check work-order-builder.js
          node --check work-orders.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "db-viewer.html work-order-builder.html work-order-builder.js work-orders.js "
      - name: Commit and push
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add db-viewer.html work-order-builder.html work-order-builder.js work-orders.js
          git commit -m "Add individual task selection and password confirmation"
          git push origin HEAD:ms02-live-sync-20260908-085804
