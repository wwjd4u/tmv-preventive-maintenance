name: Apply TMV Login Heading Cleanup

on:
  push:
    branches: [ master ]
    paths:
      - 'updates/simplify-login-heading.py'
      - '.github/workflows/tmv-login-heading.yml'

permissions:
  contents: write

jobs:
  apply-login-heading:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: ms02-live-sync-20260908-085804
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out patch script
        run: git show origin/master:updates/simplify-login-heading.py > /tmp/simplify-login-heading.py

      - name: Apply patch
        run: python3 /tmp/simplify-login-heading.py

      - name: Verify patch
        run: |
          grep -n 'Sign In' index.html
          if grep -n 'Sign in as a Superuser or Manager' index.html; then exit 1; fi
          git diff --check
          test "$(git diff --name-only)" = "index.html"

      - name: Commit and push production branch
        run: |
          git config user.name "TMV Maintenance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify and center login heading"
          git push origin HEAD:ms02-live-sync-20260908-085804
