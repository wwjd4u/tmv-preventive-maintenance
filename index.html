<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMV Preventive Maintenance</title>
<style>
  :root{
    --cudd:#812F2F; --cudd-dk:#5e2121; --ink:#1a1a1a; --line:#e3e3e3;
    --ok:#16a34a; --warn:#d97706; --due:#dc2626; --none:#9ca3af; --bg:#f5f6f8;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  /* subtle blended site photo background */
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:#f5f6f8 url('/site-bg.png') center/cover no-repeat fixed;
    filter:grayscale(.4) blur(1.5px) brightness(1.06);
    opacity:.85;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(180deg, rgba(245,246,248,.3), rgba(245,246,248,.42));
  }
  header{background:var(--cudd);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
  header img{height:52px}
  header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.4px}
  nav{margin-left:auto;display:flex;gap:8px}
  nav button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:8px 14px;border-radius:8px;font-size:14px;cursor:pointer}
  nav button.active{background:#fff;color:var(--cudd);font-weight:600}
  main{padding:18px;max-width:1100px;margin:0 auto}
  .view{display:none}
  .view.active{display:block}
  #techFrame{width:100%;height:calc(100vh - 130px);border:0;background:#f5f6f8}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  select,input,textarea{font:14px inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  option{background:#fff;color:#1a1a1a}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{border:1px solid var(--line);border-left:4px solid var(--cudd);border-radius:12px;background:#fff;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease}
  .card:hover{box-shadow:0 6px 18px rgba(129,47,47,.18);transform:translateY(-2px);border-color:var(--cudd)}
  .card h3{margin:0 0 8px;font-size:16px}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
  .b-ok{background:var(--ok)} .b-warn{background:var(--warn)} .b-due{background:var(--due)} .b-none{background:var(--none)}
  .meta{color:#666;font-size:13px;margin:4px 0}
  .err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:12px 14px;border-radius:10px;margin-bottom:14px;white-space:pre-wrap;font:13px/1.4 monospace}
  .summary{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .pill{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;text-align:center;min-width:90px}
  .pill b{display:block;font-size:22px}
  /* TMV detail */
  .tmv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .tmv-btn{border:2px solid var(--cudd);background:#fff;border-radius:12px;padding:18px;cursor:pointer;text-align:left;position:relative;overflow:hidden;transition:box-shadow .15s ease,transform .15s ease,background .15s ease,border-color .15s ease}
  .tmv-btn::before{content:"";display:block;height:4px;background:var(--cudd);margin:-18px -18px 12px}
  .tmv-btn:hover{border-color:var(--cudd-dk);background:#fdf6f6;box-shadow:0 6px 18px rgba(129,47,47,.22);transform:translateY(-2px)}
  .tmv-btn .id{color:var(--cudd);font-weight:700;font-size:16px}
  .tmv-btn .vt{color:#666;font-size:12px;margin-top:4px}
  .meta-bar{position:sticky;top:54px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:40;margin-bottom:16px}
  .meta-bar label{font-size:13px;color:#555;display:flex;flex-direction:column;gap:3px}
  .section{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;margin-bottom:12px}
  .section h3{margin:0 0 4px;font-size:15px;background:#eaf2fb;padding:8px 10px;border-radius:8px;display:flex;align-items:center;justify-content:space-between}
  .items{margin-top:10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 4px;border-bottom:1px solid #f0f0f0}
  .row:last-child{border-bottom:0}
  .row .lbl{flex:1;min-width:200px}
  .row .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .row .ctl label{font-size:13px;color:#444;display:flex;gap:4px;align-items:center}
  .row input[type=text],.row input[type=number],.row input[type=date]{padding:5px 8px;font-size:13px}
  .row select{padding:5px 8px;font-size:13px}
  .btn{background:var(--cudd);color:#fff;border:0;padding:10px 18px;border-radius:9px;font-size:15px;cursor:pointer;font-weight:600}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--cudd);border:1px solid var(--cudd)}
  .btn.back{background:#eee;color:#333;border:1px solid #ccc}
  .ticket{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px}
  .ticket pre{white-space:pre-wrap;font:13px/1.5 monospace;background:#f8f8fa;padding:12px;border-radius:8px}
  .links{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .links a{text-decoration:none;padding:10px 16px;border-radius:9px;color:#fff;font-weight:600}
  .wa{background:#25D366} .tg{background:#229ED9} .em{background:#812F2F}
  .hidden{display:none}
  /* Tracker assignments board */
  .assign-card{display:block;text-decoration:none;color:inherit;cursor:pointer;border:1px solid var(--line);border-left:4px solid var(--cudd);border-radius:12px;background:#fff;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease}
  .assign-card:hover{box-shadow:0 6px 18px rgba(129,47,47,.18);transform:translateY(-2px);border-color:var(--cudd)}
  .assign-card .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .assign-card h3{margin:0;font-size:16px}
  .assign-card .sub{color:#666;font-size:13px;margin:6px 0 2px}
  .assign-card .tech{color:#444;font-size:13px;margin-top:2px}
  .assign-card .cnt{color:#9aa;font-size:12px;margin-top:6px}
  .assign-card .open-cue{margin-top:10px;color:var(--cudd);font-weight:700;font-size:13px}
  .st{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
  .st-assigned{background:#2563eb} .st-in_progress{background:#d97706} .st-completed{background:#16a34a} .st-rejected{background:#dc2626}
  .assign-detail{border-top:1px solid #eee;margin-top:12px;padding-top:12px}
  .contact-bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .contact-bar a,.contact-bar button{text-decoration:none;color:#fff;font-size:13px;font-weight:600;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
  .cb-call{background:#16a34a} .cb-email{background:#812F2F} .cb-sms{background:#2563eb}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
  .photo img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .results-sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fbfbfd}
  .results-sec b{color:var(--cudd)}
  .prog-group{margin-top:8px}
  .prog-head{font-size:13px;font-weight:700;padding:5px 8px;border-radius:7px;margin-bottom:4px}
  .prog-head-done{background:#f0fdf4;color:#166534}
  .prog-head-todo{background:#fef2f2;color:#b91c1c}
  .prog-row{display:flex;align-items:center;gap:8px;border:0!important;padding:3px 0!important}
  .prog-row .lbl{font-size:13px;flex:1}
  .prog-row .sec-tag{font-size:11px;color:#888;background:#eee;border-radius:6px;padding:1px 6px;white-space:nowrap}
  .prog-row .ctl{font-size:13px;font-weight:600;color:#444;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .prog-done .ctl{color:#166534}
  .prog-todo .ctl{color:#b91c1c}
  .pill b{font-size:22px}
  footer{text-align:center;color:#9aa;font-size:12px;padding:18px}
  .ok-note{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:10px 14px;border-radius:10px;margin-top:14px}
  .assign-link{margin-top:12px;font-size:14px;word-break:break-all}
</style>
</head>
<body>
<header>
  <img src="cudd-logo-sm.png" alt="CUDD" onerror="this.style.display='none'">
  <h1>TMV Preventive Maintenance</h1>
  <nav>
    <button id="tabTmv" class="active" onclick="showView('tmv')">🚚 TMV Inspections</button>
    <button id="tabTracker" onclick="showView('tracker')">Tracker</button>
    <button id="tabTech" onclick="showView('tech')">Tech</button>
    <button id="tabDb" onclick="goDb()">Task.db</button>
  </nav>
</header>

<main>
  <div id="errSlot"></div>

  <!-- TRACKER VIEW — Assignments board -->
  <section id="viewTracker" class="view">
    <div class="summary" id="summary"></div>
    <div class="bar">
      <select id="filter"><option value="all">All statuses</option><option value="assigned">Assigned</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="rejected">Rejected</option></select>
      <select id="filterTech"><option value="all">All technicians</option></select>
      <input type="search" id="filterText" placeholder="Search TMV / tech…">
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- TMV INSPECTIONS VIEW -->
  <section id="viewTmv" class="view active">
    <div id="tmvPicker">
      <h2 style="margin-top:0;color:#fff">Select a TMV Unit</h2>
      <div class="tmv-grid" id="tmvGrid"></div>
    </div>

    <div id="tmvDetail" class="hidden">
      <button class="btn back" onclick="backToTmv()">← Back to TMV list</button>
      <div class="meta-bar">
        <label>TMV Unit<input type="text" id="dTmv" readonly></label>
        <label>Van Type<input type="text" id="dVan" readonly></label>
        <label>Location<select id="dLoc"></select></label>
        <label>Date<input type="date" id="dDate"></label>
        <label>Technician<select id="dTech"><option value="">— choose —</option></select></label>
      </div>
      <div id="sections"></div>
      <button class="btn" id="genBtn" onclick="submitInspection()" disabled>Generate Ticket &amp; Log</button>
      <button class="btn ghost" id="assignBtn" onclick="assignToTech()" disabled style="margin-top:10px">📲 Assign to Technician</button>
      <button class="btn ghost" id="demoBtn" onclick="loadDemo()" style="margin-top:10px">🧪 Load Demo Work Orders</button>
      <div id="assignOut" class="hidden"></div>
      <div id="ticketOut" class="hidden"></div>
    </div>
  </section>

  <!-- TECH VIEW — embeds the technician work-order page -->
  <section id="viewTech" class="view">
    <iframe id="techFrame" src="techindex.html" title="Tech work orders" loading="lazy"></iframe>
  </section>
</main>

<footer>CUDD Energy Services · Preventive Maintenance</footer>

<script src="app.js?v=20260721B"></script>
</body>
</html>
